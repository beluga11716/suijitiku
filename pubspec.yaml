name: randomselector
description: 题库抽题器 - 导入题库文档，随机抽题刷题，错题本管理
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  go_router: ^14.0.0
  provider: ^6.1.0
  file_picker: ^8.0.0
  archive: ^3.6.0
  xml: ^6.5.0
  http: ^1.2.0
  uuid: ^4.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
