name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Find Runner.app
        run: find build -name "Runner.app" -type d

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r randomselector.ipa Payload

      - name: Upload IPA to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 先尝试上传到已有 release，不存在则创建 draft
          gh release upload "$GITHUB_REF_NAME" randomselector.ipa --clobber 2>/dev/null || \
            gh release create "$GITHUB_REF_NAME" randomselector.ipa --draft --generate-notes --title "$GITHUB_REF_NAME"
